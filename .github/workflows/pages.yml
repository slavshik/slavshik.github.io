# Сборка, проверки и публикация на GitHub Pages.
#
# Публикация ждёт зелёных проверок: репозиторий содержит только исходники, а
# то, что уезжает на Pages, собирается здесь и нигде не коммитится.
#
# Скриншотные тесты гоняются в том же контейнере Playwright, что и локальный
# `make e2e`, — эталоны сняты в нём, и сравнивать их где-то ещё бессмысленно.

name: pages

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: типы, линтер, юнит-тесты, сборка
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci

            - name: типы
              run: npm run typecheck

            - name: линтер
              run: npm run lint

            - name: формат
              run: npm run format:check

            - name: юнит-тесты
              run: npm run test:unit

            - name: сборка
              run: npx vite build

            - name: бюджет веса
              run: node test/size.mjs

            - name: артефакт для публикации
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    e2e:
        name: скриншоты — desktop, tablet, mobile
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.62.1-noble
        steps:
            - uses: actions/checkout@v4

            - run: npm ci

            - name: сборка
              run: npx vite build

            - name: скриншотные тесты
              run: npx playwright test

            - name: отчёт, если что-то разошлось
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report
                      test-results
                  retention-days: 7

    deploy:
        name: публикация
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        needs: [check, e2e]
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
