<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Имя плюс род занятий: по одному имени конкуренции почти нет, а роль
       добавляет запросов, по которым страницу вообще могут искать. -->
  <title>Alexander Slavschik — Software Engineer, Web &amp; Games</title>
  <!-- Обе формы написания намеренно: «Slavschik» — имя, «slavshik» — ник,
       ищут и так, и так. Длина в пределах, которые выдача не обрезает. -->
  <meta name="description" content="Alexander Slavschik (slavshik) — software engineer working on web and games. Based in Warsaw. Links to GitHub, LinkedIn and contact.">
  <meta name="author" content="Alexander Slavschik">
  <link rel="canonical" href="https://slavshik.me/">

  <!-- Превью, когда ссылку кидают в мессенджер или соцсеть. Описание тут
       короткое, не поисковое: на карточке лучше читается строка, а не абзац. -->
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://slavshik.me/">
  <meta property="og:site_name" content="Alexander Slavschik">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Alexander Slavschik — Software Engineer">
  <meta property="og:description" content="Software engineer — web and games. Warsaw.">
  <meta property="og:image" content="https://slavshik.me/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Alexander Slavschik — software engineer, web and games, Warsaw">
  <meta property="profile:first_name" content="Alexander">
  <meta property="profile:last_name" content="Slavschik">

  <!-- Продублировано: часть скрейперов не читает og: как фолбэк. Карточка
       большая, иначе картинка ужмётся в мелкую иконку сбоку. -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Alexander Slavschik — Software Engineer">
  <meta name="twitter:description" content="Software engineer — web and games. Warsaw.">
  <meta name="twitter:image" content="https://slavshik.me/og.png">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Цвет адресной строки на мобильных; совпадает с фоном страницы -->
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">

  <!-- Выбранная тема ставится до первой отрисовки. Скрипт в head блокирующий
       и нарочно: перенеси его вниз — и на тёмной теме страница успеет мигнуть
       светлой. Всё остальное поведение кнопки живёт внизу, здесь только это. -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>

  <!-- Машиночитаемая визитка. Смысл в sameAs: он связывает страницу, GitHub,
       LinkedIn и Instagram в одну сущность, и по запросу по имени поисковик
       понимает, что это один человек, а не три однофамильца. Ничего, чего нет
       на самой странице, тут не заявлено — расхождение разметки с содержимым
       Google считает нарушением. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Alexander Slavschik",
    "alternateName": "slavshik",
    "url": "https://slavshik.me/",
    "image": "https://slavshik.me/og.png",
    "email": "mailto:slavshik@me.com",
    "jobTitle": "Software Engineer",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Warsaw",
      "addressCountry": "PL"
    },
    "sameAs": [
      "https://github.com/slavshik",
      "https://www.linkedin.com/in/slavshik",
      "https://instagram.com/slavshik"
    ]
  }
  </script>

  <!-- Карта модулей для телевизора: three лежит в /vendor, ничего не тянется
       со стороны. Объявлена до любого импорта — иначе браузер её не увидит. -->
  <script type="importmap">
  { "imports": {
      "three": "/vendor/three.module.min.js",
      "three/addons/geometries/RoundedBoxGeometry.js": "/vendor/RoundedBoxGeometry.js"
  } }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    :root {
      /* Нейтраль тёплая, не серая: бумага, а не интерфейс */
      --paper:  #f4f1ec;
      --ink:    #16151a;
      --muted:  #6f6a63;
      --faint:  #a9a29a;
      --hair:   #d8d2c8;

      /* Акцент задаётся местным временем посетителя — см. скрипт внизу.
         Значение по умолчанию = день, оно же работает без JS. */
      --accent: #2f6b57;

      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      --mono:  ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #101014;
        --ink:   #ece7de;
        --muted: #8a8378;
        --faint: #5d574f;
        --hair:  #2a2830;
      }
    }

    /* Тема, выбранная кнопкой, обязана перебивать системную в обе стороны,
       поэтому значения продублированы. Вынести их в одно место нечем: сборки
       нет, а вложенный CSS ещё не везде. */
    :root[data-theme="dark"] {
      --paper: #101014;
      --ink:   #ece7de;
      --muted: #8a8378;
      --faint: #5d574f;
      --hair:  #2a2830;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      transition: background-color 1.2s ease, color 1.2s ease;
    }

    main {
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: 3.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      /* Текст всегда поверх телевизора */
      position: relative;
      z-index: 1;
    }

    /* Сцена телевизора — во весь вьюпорт, чтобы игрушке было где летать:
       границы, в которые она упирается, это границы канваса. Фиксированная и
       вне потока: центрирование main не трогает, сдвига вёрстки не даёт вовсе.
       Где именно внутри канваса стоит телевизор, решает tv.js — он считает
       место от рамки заголовка, а не от края окна.
       pointer-events: none — канвас не перехватывает ни клики, ни выделение;
       попадания по корпусу tv.js считает рейкастом сам. */
    #tv-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #tv-stage canvas { display: block; width: 100%; height: 100%; }

    h1 {
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 5.25rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      text-wrap: balance;
      margin: 0;
    }

    /* Подложка в цвет бумаги: если телевизор пролетит за именем, буквы не
       потеряются. В тёмной теме работает так же — цвет тот же токен.
       Только при живом телевизоре: класс вешает бутстрап после удачного
       монтирования. Без него страница не должна отличаться ни пикселем. */
    .tv-on h1 {
      text-shadow: 0 0 1.4rem var(--paper), 0 0 0.5rem var(--paper);
    }
    /* Фамилия уходит в тон: имя читается первым, но целое остаётся одним блоком */
    h1 .last { color: var(--muted); }

    /* Волосяная линия — единственный декоративный элемент. Её цвет и есть акцент. */
    .rule {
      height: 1px;
      width: 100%;
      background: linear-gradient(to right, var(--accent), var(--hair) 42%, transparent);
      transition: background 1.2s ease;
    }

    .line {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.5;
      color: var(--muted);
      max-width: 32ch;
      text-wrap: pretty;
      margin: 0;
    }

    /* Ссылки помечены иконками вместо доменных подписей. Один и тот же ник
       повторяется столбцом: это факт о человеке, а не придуманный приём. */
    nav {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      align-items: flex-start;
      font-family: var(--mono);
      font-size: clamp(0.8rem, 1.9vw, 0.92rem);
      letter-spacing: -0.01em;
    }
    nav a {
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      color: var(--ink);
      text-decoration: none;
      padding-bottom: 2px;
      position: relative;
    }
    nav a .icon {
      width: 1.1em;
      height: 1.1em;
      color: var(--faint);
      transition: color 0.35s ease;
      flex: none;
    }
    nav a:hover .icon,
    nav a:focus-visible .icon { color: var(--muted); }

    /* Подчёркивание вырастает от левого края, а не проявляется целиком */
    nav a::after {
      content: '';
      position: absolute;
      left: 0; bottom: 0;
      height: 1px; width: 0;
      background: var(--accent);
      transition: width 0.35s cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    nav a:hover::after,
    nav a:focus-visible::after { width: 100%; }
    nav a:focus-visible { outline: none; }

    /* Переключатель темы. Показывается только когда JS жив: сохранить выбор
       без него всё равно некуда, а мёртвая кнопка хуже отсутствующей.
       Оформлен как иконки в колонке ссылок — тем же приглушённым цветом и с
       тем же временем перехода, чтобы не выглядеть деталью из другой части. */
    #theme[hidden] { display: none; }
    #theme {
      position: fixed;
      top: 1.4rem;
      right: 1.6rem;
      z-index: 2;
      display: inline-flex;
      padding: 0.4rem;
      border: 0;
      background: none;
      color: var(--faint);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.35s ease;
    }
    #theme:hover, #theme:focus-visible { color: var(--muted); }
    #theme:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
    #theme .icon {
      width: 1.15rem;
      height: 1.15rem;
      transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.3, 1);
    }
    /* Закрашенная половина кружка переворачивается вместе с темой: состояние
       видно без второй иконки и без подписи. */
    :root[data-theme="dark"] #theme .icon { transform: rotate(180deg); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) #theme .icon { transform: rotate(180deg); }
    }

    .mail { margin-top: 0.5rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="tv-stage" aria-hidden="true"></div>

  <main>
    <h1>Alexander<br><span class="last">Slavschik</span></h1>

    <div class="rule"></div>

    <p class="line">Software engineer — web and games. Warsaw.</p>

    <nav>
      <a href="https://github.com/slavshik" rel="me">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.75 5.48.75 11.75c0 5.02 3.26 9.28 7.78 10.78.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.17.69-3.83-1.34-3.83-1.34-.52-1.31-1.26-1.66-1.26-1.66-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.51-2.53-.29-5.19-1.27-5.19-5.63 0-1.24.44-2.26 1.17-3.06-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.17.91-.25 1.89-.38 2.86-.39.97.01 1.95.14 2.86.39 2.18-1.48 3.14-1.17 3.14-1.17.62 1.57.23 2.73.11 3.02.73.8 1.17 1.82 1.17 3.06 0 4.37-2.66 5.34-5.2 5.62.41.36.77 1.06.77 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.2.66.79.55A11.26 11.26 0 0 0 23.25 11.75C23.25 5.48 18.27.5 12 .5Z"/></svg>
        slavshik
      </a>
      <a href="https://www.linkedin.com/in/slavshik" rel="me">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5.34 3C4.05 3 3 4.02 3 5.28c0 1.25 1.05 2.27 2.34 2.27 1.3 0 2.35-1.02 2.35-2.27C7.69 4.02 6.64 3 5.34 3ZM3.28 9.15h4.12V21H3.28V9.15Zm6.98 0h3.95v1.62h.06c.55-1.02 1.9-2.1 3.9-2.1 4.17 0 4.94 2.66 4.94 6.12V21h-4.11v-5.42c0-1.29-.03-2.96-1.85-2.96-1.85 0-2.13 1.42-2.13 2.87V21h-4.1V9.15Z"/></svg>

      <a href="https://instagram.com/slavshik" rel="me">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.3" cy="6.7" r="1.05" fill="currentColor" stroke="none"/></svg>

      <a class="mail" href="mailto:slavshik@me.com">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>
        slavshik@me.com
      </a>
    </nav>
  </main>

  <button id="theme" type="button" hidden aria-label="Toggle theme" title="Theme">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>
    </svg>
  </button>

  <script>
    // Акцент меняется по местному времени посетителя: рассвет, день, закат, ночь.
    // Единственная «живая» деталь страницы — и она честная: никаких выдуманных
    // статусов и фейковых данных, только время у того, кто смотрит.
    // Без JS страница остаётся полностью рабочей с дневным акцентом.
    (function () {
      // ?aqa=1 — прогон скриншотных тестов. Время суток там сломало бы эталоны:
      // один и тот же коммит давал бы четыре разные картинки за сутки. Акцент
      // фиксируется дневным — ровно по той же причине он намертво зашит в
      // og.png и favicon.svg, куда время суток тоже не передать.
      var h = new URLSearchParams(location.search).get('aqa') === '1'
        ? 12
        : new Date().getHours();
      var accent =
        h >= 5  && h < 9  ? '#c2643f' :   // рассвет — терракота
        h >= 9  && h < 17 ? '#2f6b57' :   // день — глубокий зелёный
        h >= 17 && h < 21 ? '#b07d2b' :   // закат — охра
                            '#6f86c9';    // ночь — индиго
      document.documentElement.style.setProperty('--accent', accent);
    })();

    // Переключатель темы. По умолчанию тема системная, и кнопка её только
    // перебивает. Если выбранное совпало с системным, override снимается
    // совсем — иначе страница навсегда перестала бы следовать за системой,
    // хотя посетитель ничего такого не просил.
    (function () {
      var btn = document.getElementById('theme');
      if (!btn) return;
      var root = document.documentElement;
      var sysDark = matchMedia('(prefers-color-scheme: dark)');

      // Цвет адресной строки на мобильных задан двумя мета-тегами через media.
      // Пока тема системная, пусть каждый остаётся при своём; как только выбор
      // сделан руками, обоим проставляется один цвет — media их больше не
      // разводит, потому что выбор сильнее системы.
      function paintMeta(forced) {
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          var m = metas[i];
          m.setAttribute('content', forced
            ? (forced === 'dark' ? '#101014' : '#f4f1ec')
            : (/dark/.test(m.media) ? '#101014' : '#f4f1ec'));
        }
      }

      function effective() {
        return root.dataset.theme || (sysDark.matches ? 'dark' : 'light');
      }

      function apply(mode) {
        if (mode === (sysDark.matches ? 'dark' : 'light')) {
          delete root.dataset.theme;
          try { localStorage.removeItem('theme'); } catch (e) {}
        } else {
          root.dataset.theme = mode;
          try { localStorage.setItem('theme', mode); } catch (e) {}
        }
        paintMeta(root.dataset.theme || null);
      }

      paintMeta(root.dataset.theme || null);
      btn.hidden = false;
      btn.addEventListener('click', function () {
        apply(effective() === 'dark' ? 'light' : 'dark');
      });
    })();

    // Телевизор — необязательная деталь. Грузится только после того, как
    // страница отрисована, и только туда, где ему рады. Всё, что он умеет
    // сломать в худшем случае — это не появиться.
    (function () {
      var stage = document.getElementById('tv-stage');
      if (!stage) return;

      // Телевизор выключен по умолчанию и включается ?tv=1 — временно, пока
      // не будет решено показывать его всем. Тогда отсюда уходит ровно это
      // условие, и больше ничего.
      // ?aqa=1 — отдельный, ортогональный ключ для скриншотных тестов: он не
      // включает телевизор, а запрещает всему двигаться. ?aqa=1 без ?tv=1 —
      // это снимок страницы без телевизора, тоже нужный эталон.
      var q = new URLSearchParams(location.search);
      var aqa = q.get('aqa') === '1';
      if (q.get('tv') !== '1') return;

      // Просили меньше движения — значит, никакого телевизора. Показывать
      // вместо него статичную картинку было бы хуже, чем не показывать ничего.
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      // Экономия трафика и совсем слабые машины — мимо
      var net = navigator.connection;
      if (net && (net.saveData || /(^|-)2g$/.test(net.effectiveType || ''))) return;
      if (navigator.deviceMemory && navigator.deviceMemory < 2) return;

      // WebGL2 проверяем до импорта: не тянуть три четверти мегабайта туда,
      // где нечем рисовать. С r163 three умеет только WebGL2.
      try {
        if (!document.createElement('canvas').getContext('webgl2')) return;
      } catch (e) { return; }

      var boot = function () {
        import('/tv.js')
          .then(function (m) {
            m.mount(stage, { frozen: aqa });
            // Класс — только после удачного монтирования: подложка под именем
            // нужна ровно тогда, когда за именем правда что-то летает.
            document.documentElement.classList.add('tv-on');
            // Неподвижный кадр рисуется синхронно внутри mount(), так что к
            // этой строке он уже на экране. Плейврайту достаточно дождаться
            // селектора — ни инъекций, ни сна на удачу.
            if (aqa) document.documentElement.setAttribute('data-tv', 'ready');
          })
          .catch(function () { /* тихо: страница и без него целая */ });
      };
      var idle = window.requestIdleCallback || function (f) { setTimeout(f, 200); };
      if (document.readyState === 'complete') idle(boot);
      else addEventListener('load', function () { idle(boot); }, { once: true });
    })();
  </script>
</body>
</html>
