<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Стенд — телевизор</title>

  <!-- Тот же importmap, что на боевой странице: пути абсолютные, поэтому
       /tv.js работает и отсюда, и из корня. Нужен сервер, не file://. -->
  <script type="importmap">
  { "imports": {
      "three": "/vendor/three.module.min.js",
      "three/addons/geometries/RoundedBoxGeometry.js": "/vendor/RoundedBoxGeometry.js"
  } }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    :root {
      --paper:  #f4f1ec; --ink: #16151a; --muted: #6f6a63;
      --faint:  #a9a29a; --hair: #d8d2c8; --accent: #2f6b57;
      --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      --mono:  ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    }
    body.dark {
      --paper: #101014; --ink: #ece7de; --muted: #8a8378;
      --faint: #5d574f; --hair: #2a2830;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
      min-height: 100svh;
    }

    /* Стейдж повторяет боевой один в один */
    #tv-stage {
      position: fixed;
      inset: 0 0 auto 0;
      height: min(58svh, 28rem);
      z-index: 0;
      pointer-events: none;
    }
    #tv-stage canvas { display: block; width: 100%; height: 100%; }
    #tv-stage.outline { outline: 1px dashed color-mix(in srgb, var(--faint) 60%, transparent); }

    /* Копия боевой вёрстки — включается чекбоксом «текст» */
    #overlay { display: none; }
    #overlay.on { display: flex; }
    #overlay {
      position: fixed; inset: 0;
      align-items: center;
      z-index: 1;
      pointer-events: none;
      font-family: var(--serif);
    }
    #overlay .col {
      width: 100%; max-width: 44rem; margin: 0 auto; padding: 3.5rem 2rem;
      display: flex; flex-direction: column; gap: 2.5rem;
    }
    #overlay h1 {
      font-weight: 400; font-size: clamp(2.6rem, 9vw, 5.25rem);
      line-height: 0.95; letter-spacing: -0.02em; margin: 0;
      text-shadow: 0 0 1.4rem var(--paper), 0 0 0.5rem var(--paper);
    }
    #overlay h1 .last { color: var(--muted); }
    #overlay .rule {
      height: 1px; width: 100%;
      background: linear-gradient(to right, var(--accent), var(--hair) 42%, transparent);
    }
    #overlay .line {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem); line-height: 1.5;
      color: var(--muted); max-width: 32ch; margin: 0;
    }
    #overlay nav {
      display: flex; flex-direction: column; gap: 0.55rem; align-items: flex-start;
      font-family: var(--mono); font-size: clamp(0.8rem, 1.9vw, 0.92rem);
      pointer-events: auto;
    }
    #overlay nav a { color: var(--ink); text-decoration: none; }

    /* Пульт */
    #panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 19rem;
      z-index: 10;
      overflow-y: auto;
      padding: 0.9rem 1rem 3rem;
      background: color-mix(in srgb, var(--paper) 92%, var(--ink));
      border-left: 1px solid var(--hair);
      line-height: 1.5;
    }
    #panel.hidden { transform: translateX(100%); }
    #panel h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 1.2rem 0 0.4rem; font-weight: 400;
    }
    #panel h2:first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 6.2rem 1fr 3rem; align-items: center; gap: 0.4rem; }
    .row label { color: var(--muted); }
    .row output { text-align: right; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; }
    .btns { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    button {
      font: inherit; font-family: var(--mono);
      padding: 0.3rem 0.6rem; cursor: pointer;
      color: var(--ink); background: var(--paper);
      border: 1px solid var(--hair); border-radius: 3px;
    }
    button:hover { border-color: var(--muted); }
    .checks { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .checks label { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--muted); cursor: pointer; }
    #hud { white-space: pre; color: var(--muted); font-size: 11px; }
    #toggle {
      position: fixed; right: 0.5rem; top: 0.5rem; z-index: 11;
    }
    #err {
      position: fixed; left: 1rem; bottom: 1rem; z-index: 12; max-width: 40rem;
      color: #c2643f; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="tv-stage"></div>

  <div id="overlay">
    <div class="col">
      <h1>Alexander<br><span class="last">Slavschik</span></h1>
      <div class="rule"></div>
      <p class="line">Software engineer — web and games. Warsaw.</p>
      <nav>
        <a href="#">slavshik</a>
        <a href="#">slavshik</a>
        <a href="#">slavshik</a>
        <a href="#">slavshik@me.com</a>
      </nav>
    </div>
  </div>

  <button id="toggle">пульт</button>

  <div id="panel">
    <h2>Действия</h2>
    <div class="btns">
      <button data-act="kick">Пнуть</button>
      <button data-act="wheelUp">Колесо ↑</button>
      <button data-act="wheelDown">Колесо ↓</button>
      <button data-act="reset">Сброс</button>
      <button data-act="pause">Пауза</button>
    </div>

    <h2>Вид</h2>
    <div class="checks">
      <label><input type="checkbox" id="c-text"> текст</label>
      <label><input type="checkbox" id="c-dark"> тёмная</label>
      <label><input type="checkbox" id="c-wire"> сетка</label>
      <label><input type="checkbox" id="c-outline"> границы</label>
    </div>

    <h2>Акцент</h2>
    <div class="btns">
      <button data-accent="#c2643f">рассвет</button>
      <button data-accent="#2f6b57">день</button>
      <button data-accent="#b07d2b">закат</button>
      <button data-accent="#6f86c9">ночь</button>
    </div>

    <h2>Физика</h2>
    <div id="sliders"></div>

    <h2>Телеметрия</h2>
    <div id="hud">—</div>
  </div>

  <div id="err"></div>

  <script type="module">
    import { mount } from '/tv.js';

    const errBox = document.getElementById('err');
    addEventListener('error', (e) => { errBox.textContent += '\n' + e.message; });

    const stage = document.getElementById('tv-stage');
    const api = mount(stage);
    window.tv = api;                       // для консоли и headless-проверок

    const D = api.debug;

    /* Ползунки строятся из самого объекта параметров: добавил константу в
       tv.js — она появилась на стенде, руками ничего дублировать не надо. */
    const RANGES = {
      gravity: [-60, -4], homeK: [0, 30], homeC: [0, 8],
      uprightK: [0, 80], uprightC: [0, 12], airV: [0, 3], airW: [0, 4],
      rest: [0, 0.9], vRest: [0, 2], friction: [0.3, 1], groundDrag: [0, 12], spinLoss: [0.2, 1],
      kickV: [1, 16], wheelV: [0, 0.05], antK: [10, 300], antC: [0, 20], antLever: [0, 1.5],
      ropeG: [0, 60], ropeDamp: [0.9, 1],
    };

    const sliders = document.getElementById('sliders');
    for (const [key, [min, max]] of Object.entries(RANGES)) {
      const row = document.createElement('div');
      row.className = 'row';
      const step = (max - min) / 400;
      row.innerHTML =
        `<label for="p-${key}">${key}</label>` +
        `<input type="range" id="p-${key}" min="${min}" max="${max}" step="${step}" value="${D.params[key]}">` +
        `<output>${(+D.params[key]).toFixed(3)}</output>`;
      const input = row.querySelector('input');
      const out = row.querySelector('output');
      input.addEventListener('input', () => {
        D.params[key] = parseFloat(input.value);
        out.textContent = parseFloat(input.value).toFixed(3);
        D.state.sleeping = false;
      });
      sliders.appendChild(row);
    }

    const acts = {
      kick:      () => D.kick(),
      wheelUp:   () => D.wheel(-160),
      wheelDown: () => D.wheel(160),
      reset:     () => D.reset(),
      pause:     (b) => { paused = !paused; D.setPaused(paused); b.textContent = paused ? 'Пуск' : 'Пауза'; },
    };
    let paused = false;
    for (const b of document.querySelectorAll('[data-act]')) {
      b.addEventListener('click', () => acts[b.dataset.act](b));
    }

    for (const b of document.querySelectorAll('[data-accent]')) {
      b.addEventListener('click', () => {
        document.documentElement.style.setProperty('--accent', b.dataset.accent);
        D.refreshTheme();
      });
    }

    document.getElementById('c-text').addEventListener('change', (e) =>
      document.getElementById('overlay').classList.toggle('on', e.target.checked));
    document.getElementById('c-dark').addEventListener('change', (e) => {
      document.body.classList.toggle('dark', e.target.checked);
      D.setForceDark(e.target.checked);
    });
    document.getElementById('c-wire').addEventListener('change', (e) => D.setWireframe(e.target.checked));
    document.getElementById('c-outline').addEventListener('change', (e) =>
      stage.classList.toggle('outline', e.target.checked));

    const panel = document.getElementById('panel');
    document.getElementById('toggle').addEventListener('click', () => panel.classList.toggle('hidden'));

    /* Телеметрия */
    const hud = document.getElementById('hud');
    let frames = 0, fps = 0, t0 = performance.now();
    (function tick() {
      requestAnimationFrame(tick);
      frames++;
      const now = performance.now();
      if (now - t0 >= 500) { fps = Math.round(frames * 1000 / (now - t0)); frames = 0; t0 = now; }
      const s = D.state, r = D.renderer.info.render;
      hud.textContent =
        `fps    ${fps}\n` +
        `x  ${s.x.toFixed(3)}   y  ${s.y.toFixed(3)}\n` +
        `vx ${s.vx.toFixed(3)}   vy ${s.vy.toFixed(3)}\n` +
        `th ${s.th.toFixed(3)}   om ${s.om.toFixed(3)}\n` +
        `сон    ${s.sleeping ? 'да' : 'нет'}\n` +
        `на полу ${s.grounded ? 'да' : 'нет'}\n` +
        `calls  ${r.calls}   tris ${r.triangles}`;
    })();
  </script>
</body>
</html>
